default_stages: [pre-commit]

repos:
  # ── uv lockfile integrity check ───────────────────────────────────────────
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.2
    hooks:
      # Blocking: uv.lock must be in sync with pyproject.toml
      - id: uv-lock
      - id: uv-lock
        name: uv-lock (experiments)
        args: ["--project", "experiments"]
        files: ^experiments/(uv\.lock|pyproject\.toml)$
      # experiments/requirements.txt (pip installs) mirrors experiments/uv.lock
      - id: uv-export
        name: uv-export (experiments/requirements.txt)
        args: ["--project", "experiments", "--frozen", "--no-hashes", "--no-emit-package", "dicex", "--output-file", "experiments/requirements.txt"]
        files: ^experiments/(uv\.lock|pyproject\.toml)$

  # ── Local hooks aligned with uv.lock versions ─────────────────────────────
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Linter (aligned to uv.lock)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff Formatter (aligned to uv.lock)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: pyright-strict
        name: Pyright Type Checking (aligned to uv.lock)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: cargo-fmt
        name: Rust Formatter (cargo fmt)
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: Rust Linter (cargo clippy)
        entry: cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
