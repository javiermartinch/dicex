[project]
name = "dicex-experiments"
version = "0.1.0"
description = "Experiments for DiCEx"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dicex",
    "cloudpickle>=3.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=2.0.0",
    "openml>=0.15.1",
    "optuna>=4.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.4.0",
    "scipy>=1.10.0",
    "seaborn>=0.13.0",
    "xgboost>=2.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
dicex = { path = "..", editable = true }
