# =============================================================================
# Docs — build the MkDocs site and publish it on GitHub Pages
# =============================================================================
#
# Pull requests only build the site (in strict mode, so broken links fail).
# Pushes to main also deploy it to https://javiermartinch.github.io/dicex.
# Requires Settings > Pages > Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # mkdocstrings reads the sources statically, so the Rust extension is not built.
      - name: Install the documentation tools
        run: uv sync --only-group docs --locked
      - name: Build the site
        run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
